[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
version = "0.2.5"
description = "TradingAgents: Multi-Agents LLM Financial Trading Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.81",
    "backtrader>=1.9.78.123",
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.3.0",
    "parsel>=1.10.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "setuptools>=80.9.0",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "yfinance>=0.2.63",
]

[project.scripts]
tradingagents = "cli.main:app"

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*"]

[tool.setuptools.package-data]
cli = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "F403", "F405"]
# Defense-in-depth against autofix accidents: ruff still REPORTS unused
# imports (F401), but `--fix` will refuse to delete them. Re-export shim
# modules look like they have unused imports and were silently gutted by a
# previous `ruff check --fix` run, breaking the package at import time.
# Removing F401 imports stays a manual decision so the dev can spot real
# re-exports (especially in `agent_utils.py`, `dataflows/alpha_vantage.py`,
# and any future facade module) before deleting anything.
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
# These files are intentionally re-export shims for backwards compatibility
# after the tools/data-vendor split. `__all__` already declares the public
# surface; this just silences the F401 warning in `ruff check`.
"tradingagents/agents/utils/agent_utils.py" = ["F401"]
"tradingagents/dataflows/alpha_vantage.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "pyright>=1.1.380",
    "pre-commit>=3.8.0",
]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.10"
include = ["tradingagents", "cli", "tests"]
exclude = ["**/node_modules", "**/__pycache__", ".venv"]
venv = ".venv"
